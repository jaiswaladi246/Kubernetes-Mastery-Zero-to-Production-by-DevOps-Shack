# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab09 }
---
apiVersion: v1
kind: Pod
metadata: { name: guaranteed, namespace: lab09 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Pod
metadata: { name: burstable, namespace: lab09 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata: { name: besteffort, namespace: lab09 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
