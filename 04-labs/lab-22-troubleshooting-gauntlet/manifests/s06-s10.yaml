# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: apps/v1
kind: Deployment
metadata: { name: s06-notready, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s06-notready } }
  template:
    metadata: { labels: { app: s06-notready } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s07-svc, namespace: gauntlet }
spec:
  replicas: 2
  selector: { matchLabels: { app: s07-svc } }
  template:
    metadata: { labels: { app: s07-svc } }
    spec:
      containers:
        - { name: web, image: nginx:1.27, ports: [{ containerPort: 80 }], resources: { requests: { cpu: 10m, memory: 16Mi } } }
---
apiVersion: v1
kind: Service
metadata: { name: s07-svc, namespace: gauntlet }
spec:
  selector: { app: s07-svc }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: s08-pvc, namespace: gauntlet }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: premium-ssd
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s08-pvc, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s08-pvc } }
  template:
    metadata: { labels: { app: s08-pvc } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          volumeMounts: [{ name: d, mountPath: /data }]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
      volumes:
        - name: d
          persistentVolumeClaim: { claimName: s08-pvc }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s09-probe, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s09-probe } }
  template:
    metadata: { labels: { app: s09-probe } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo started; sleep infinity"]
          livenessProbe:
            exec: { command: ["sh", "-c", "sleep 2"] }
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s10-selector, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s10 } }
  template:
    metadata: { labels: { app: s10-selector } }
    spec:
      containers:
        - { name: app, image: busybox:1.36, command: ["sleep", "infinity"], resources: { requests: { cpu: 10m, memory: 16Mi } } }
