# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: apps/v1
kind: Deployment
metadata: { name: s01-image, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s01-image } }
  template:
    metadata: { labels: { app: s01-image } }
    spec:
      containers:
        - { name: web, image: "ngnix:1.27", resources: { requests: { cpu: 10m, memory: 16Mi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s02-crash, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s02-crash } }
  template:
    metadata: { labels: { app: s02-crash } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/app/start.sh"]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: s03-config, namespace: gauntlet }
data:
  DB_URL: postgres://db:5432/app
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s03-config, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s03-config } }
  template:
    metadata: { labels: { app: s03-config } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          env:
            - name: DATABASE_URL
              valueFrom: { configMapKeyRef: { name: s03-config, key: DATABASE_URL } }
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s04-pending, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s04-pending } }
  template:
    metadata: { labels: { app: s04-pending } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources: { requests: { cpu: "32", memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s05-oom, namespace: gauntlet }
spec:
  replicas: 1
  selector: { matchLabels: { app: s05-oom } }
  template:
    metadata: { labels: { app: s05-oom } }
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-c", "b = bytearray(64 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 16Mi }
