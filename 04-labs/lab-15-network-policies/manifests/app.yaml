# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab15 }
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab15-other
  labels: { team: monitoring }
---
apiVersion: v1
kind: Pod
metadata: { name: frontend, namespace: lab15, labels: { tier: frontend } }
spec:
  containers:
    - { name: c, image: nicolaka/netshoot, command: ["sleep", "infinity"], resources: { requests: { cpu: 10m, memory: 32Mi } } }
---
apiVersion: v1
kind: Pod
metadata: { name: api, namespace: lab15, labels: { tier: api } }
spec:
  containers:
    - { name: c, image: nginx:1.27, ports: [{ containerPort: 80 }], resources: { requests: { cpu: 10m, memory: 32Mi } } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: lab15 }
spec:
  selector: { tier: api }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: Pod
metadata: { name: db, namespace: lab15, labels: { tier: db } }
spec:
  containers:
    - { name: c, image: nginx:1.27, ports: [{ containerPort: 80 }], resources: { requests: { cpu: 10m, memory: 32Mi } } }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: lab15 }
spec:
  selector: { tier: db }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: Pod
metadata: { name: attacker, namespace: lab15-other, labels: { tier: frontend } }
spec:
  containers:
    - { name: c, image: nicolaka/netshoot, command: ["sleep", "infinity"], resources: { requests: { cpu: 10m, memory: 32Mi } } }
