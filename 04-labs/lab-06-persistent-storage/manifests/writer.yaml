# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: apps/v1
kind: Deployment
metadata: { name: writer, namespace: lab06 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: writer } }
  template:
    metadata: { labels: { app: writer } }
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date) from $HOSTNAME\" >> /data/log.txt; sleep 5; done"]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
