# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab05 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: lab05 }
data:
  LOG_LEVEL: info
  app.properties: |
    cache.ttl=300
---
apiVersion: v1
kind: Secret
metadata: { name: db-creds, namespace: lab05 }
type: Opaque
stringData:
  username: app
  password: Lab05-NotSoSecret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: lab05 }
spec:
  replicas: 2
  selector: { matchLabels: { app: app } }
  template:
    metadata: { labels: { app: app } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: app-config, key: LOG_LEVEL } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-creds, key: username } }
          volumeMounts:
            - { name: config, mountPath: /etc/app, readOnly: true }
            - { name: creds, mountPath: /etc/creds, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: config
          configMap:
            name: app-config
            items: [{ key: app.properties, path: app.properties }]
        - name: creds
          secret: { secretName: db-creds, defaultMode: 0400 }
