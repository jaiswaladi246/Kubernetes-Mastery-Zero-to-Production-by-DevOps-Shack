# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Pod
metadata: { name: bad-config, namespace: lab05 }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: API_KEY
          valueFrom: { secretKeyRef: { name: db-creds, key: api-key } }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
