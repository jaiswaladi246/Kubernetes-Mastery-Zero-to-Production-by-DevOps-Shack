# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: { name: selfsigned, namespace: lab13 }
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: shop-tls, namespace: lab13 }
spec:
  secretName: shop-tls
  dnsNames: [shop.local]
  duration: 2160h
  renewBefore: 360h
  issuerRef: { name: selfsigned, kind: Issuer }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop-tls, namespace: lab13 }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [shop.local], secretName: shop-tls }]
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
