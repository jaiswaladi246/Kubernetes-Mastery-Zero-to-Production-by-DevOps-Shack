# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: lab02
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'connecting to DB_HOST=$DB_HOST'; echo 'fatal: DB_HOST not set' >&2; exit 3"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
