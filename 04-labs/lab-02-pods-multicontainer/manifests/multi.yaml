# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata:
  name: lab02
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: lab02
  labels: { app: web }
spec:
  initContainers:
    - name: content
      image: busybox:1.36
      command: ["sh", "-c", "echo '<h1>Kubernetes Mastery by DevOps Shack</h1>' > /work/index.html"]
      volumeMounts: [{ name: html, mountPath: /work }]
    - name: log-tailer
      image: busybox:1.36
      restartPolicy: Always
      command: ["sh", "-c", "touch /logs/access.log; tail -F /logs/access.log"]
      volumeMounts: [{ name: logs, mountPath: /logs }]
  containers:
    - name: nginx
      image: nginx:1.27
      ports: [{ containerPort: 80 }]
      volumeMounts:
        - { name: html, mountPath: /usr/share/nginx/html }
        - { name: logs, mountPath: /var/log/nginx }
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { memory: 128Mi }
  volumes:
    - name: html
      emptyDir: {}
    - name: logs
      emptyDir: {}
