# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab24 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: notes, namespace: lab24 }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notes, namespace: lab24 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: notes } }
  template:
    metadata: { labels: { app: notes } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /data/notes.txt; sleep 5; done"]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: notes }
