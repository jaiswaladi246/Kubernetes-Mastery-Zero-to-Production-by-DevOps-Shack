# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: velero-minio }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: velero-minio }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
          command: ["sh", "-c", "mkdir -p /data/velero && minio server /data --console-address :9001"]
          env:
            - { name: MINIO_ROOT_USER, value: devopsshack }
            - { name: MINIO_ROOT_PASSWORD, value: devopsshack123 }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          resources: { requests: { cpu: 50m, memory: 128Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: velero-minio }
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
