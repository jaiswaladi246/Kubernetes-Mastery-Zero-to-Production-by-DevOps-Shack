# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: lab11-low }
value: 100
description: "Batch filler"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: lab11-critical }
value: 100000
description: "Critical service"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: filler, namespace: lab11 }
spec:
  replicas: 6
  selector: { matchLabels: { tier: filler } }
  template:
    metadata: { labels: { tier: filler } }
    spec:
      priorityClassName: lab11-low
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 500m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: critical, namespace: lab11 }
spec:
  replicas: 3
  selector: { matchLabels: { tier: critical } }
  template:
    metadata: { labels: { tier: critical } }
    spec:
      priorityClassName: lab11-critical
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 500m, memory: 32Mi }
