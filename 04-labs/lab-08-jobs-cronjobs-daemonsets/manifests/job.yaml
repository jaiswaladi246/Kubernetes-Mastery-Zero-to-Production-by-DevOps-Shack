# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab08 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: shards, namespace: lab08 }
spec:
  completions: 9
  parallelism: 3
  completionMode: Indexed
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo processing shard $JOB_COMPLETION_INDEX on $HOSTNAME; sleep 5"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
