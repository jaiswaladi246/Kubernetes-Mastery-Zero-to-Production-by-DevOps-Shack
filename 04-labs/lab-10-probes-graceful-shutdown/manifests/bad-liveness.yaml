# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: apps/v1
kind: Deployment
metadata: { name: fake-db, namespace: lab10 }
spec:
  replicas: 1
  selector: { matchLabels: { app: fake-db } }
  template:
    metadata: { labels: { app: fake-db } }
    spec:
      containers:
        - name: db
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: v1
kind: Service
metadata: { name: fake-db, namespace: lab10 }
spec:
  selector: { app: fake-db }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fragile, namespace: lab10 }
spec:
  replicas: 3
  selector: { matchLabels: { app: fragile } }
  template:
    metadata: { labels: { app: fragile } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          livenessProbe:            # ANTI-PATTERN: depends on another service
            exec: { command: ["wget", "-qO-", "-T", "1", "http://fake-db"] }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
