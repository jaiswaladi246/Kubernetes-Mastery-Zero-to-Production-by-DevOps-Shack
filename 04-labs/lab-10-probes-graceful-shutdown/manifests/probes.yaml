# Kubernetes Mastery: Zero to Production · by DevOps Shack · https://devopsshack.com · https://www.youtube.com/@devopsshack
apiVersion: v1
kind: Namespace
metadata: { name: lab10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: probe-demo, namespace: lab10 }
spec:
  replicas: 2
  selector: { matchLabels: { app: probe-demo } }
  template:
    metadata: { labels: { app: probe-demo } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          command: ["sh", "-c", "echo ok > /usr/share/nginx/html/ready; echo ok > /usr/share/nginx/html/healthz; exec nginx -g 'daemon off;'"]
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /ready, port: 80 }
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 20m, memory: 32Mi }
